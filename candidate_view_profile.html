<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>candidate view profile</title>
  <style>/*colours and proper spacing tbd*/
    body 
    {
      font-family: Arial, Helvetica, sans-serif;
      margin: 15px;
      background-color: #dadada;
    }

    p
    {
      padding: 10px;
    }

    .header 
    {
      background-color: dodgerblue;
      color: white;
      padding: 40px 40px;
      text-align: left;
    }

    .main 
    {
      width: 100%;/*limit the overall width just incase*/
      margin: 40px auto;/*make same by defaut*/
      padding: 20px;
      box-sizing: border-box;
    }

    .box /*page containters*/
    {
      width: 100%;
      box-sizing: border-box;
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    h1, h2 
    {
      margin-top: 10px;
      padding: 10px;
    }

    .button_row /*buttons margin*/
    {
      margin-top: 15px;
      padding: 10px;
    }

    .blue_button /*buttons style smoothing out*/
    {
      background-color: dodgerblue;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .blue_button:hover /*just hover opacity of the page buttons*/
    {
      opacity: 0.8;
      transform: scale(1.03);
    }

    .listing_box /*box that shows a preview of a job*/
    {
      margin-top: 20px;
      max-width: 600px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background-color: #ffffff;
      padding: 20px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .listing_box:hover
    {
      opacity: 0.8;
      transform: scale(1.03);
    }
  </style>
</head>



<body>

  <div class="header">
          <button class="blue_button" onclick="window.location.href='main.html'">
      < back to home
    </button>
    <h1>Talent Match - Your Profile</h1>
  </div>

  <div class="main">

    <div class="box">
      <h2>Welcome to your Profile</h2>
      <p>Potential employers can view your skills and experience uploaded.</p>
    </div>

    
    <div class="box">
      <h2>Options</h2>
      <div class="button_row">
        <button class="blue_button">Edit Profile</button><!--turn into modal thing like the login button-->
        <button class="blue_button">Upload Resume</button>
      </div>
      <hr>
      <h2>Saved Listings</h2>
      <div class="listing_box">
        <p>Job listings can appear here in boxes like this.........................</p>
      </div>
    </div>

<!--Things to add:
    1. back button - done
    2. upload resume script
    3. edit profile functionality
-->

  </div>

</body>

</html>
