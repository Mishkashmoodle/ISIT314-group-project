<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <Style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 15px;
        background-color: #f3f9ff;
        }

    .header 
    {
      background-color: dodgerblue;
      color: white;
      padding: 40px 40px;
      text-align: left;
    }

    .main 
    {
      max-width: 900px;/*limit the overall width just incase*/
      margin: 40px auto;/*make same by defaut*/
      padding: 20px;
    }

    .box /*page containters with 2 main sections*/
    {
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      position: relative;
    }

    .listing_box /*box that shows a preview of a job*/
    {
      margin-top: 20px;
      max-width: 600px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      background-color: #ffffff;
      padding: 20px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .listing_box:hover
    {
      opacity: 0.8;
      transform: scale(1.03);
    }

        /* Full-width input fields */
        input[type=text], input[type=password] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .account-type-toggle {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        .account-type-option {
            flex: 1;
            background-color: #d9ecff;
            color: #0b3d75;
            border: 1px solid #8bbcf2;
        }
        .account-type-option.active {
            background-color: dodgerblue;
            color: white;
            border-color: dodgerblue;
        }
        .hidden-field {
            display: none;
        }
        .buttonaddlisting {
            background-color: dodgerblue;
            color: white;
            text-align: center;
            position: absolute;
            top: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 999px;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }
        button {
            background-color: dodgerblue;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .buttonlogin {
            background-color: black;
            border: none;
            color: white;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 12px;
            position: fixed; /* Positions relative to the browser window */
            top: 10px;       /* 10px from the top edge */
            right: 10px;
            z-index: 1000;
        }

        button:hover {
            opacity: 0.8;
        }

        /* Extra styles for the cancel button */
        .cancelbtn {
            width: auto;
            padding: 10px 18px;
            background-color: #f44336;
        }

        .container {
            padding: 16px;
        }

        span.psw {
            float: right;
            padding-top: 16px;
        }

        /* The Modal (background) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgb(0,0,0); /* Fallback color */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
            padding-top: 60px;
        }

        /* Modal Content/Box */
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto 15% auto; /* 5% from the top, 15% from the bottom and centered */
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
        }

        /* The Close Button (x) */
        .close {
            position: absolute;
            right: 25px;
            top: 0;
            color: #000;
            font-size: 35px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: red;
            cursor: pointer;
        }

        /* Add Zoom Animation */
        .animate {
            -webkit-animation: animatezoom 0.6s;
            animation: animatezoom 0.6s
        }

        @-webkit-keyframes animatezoom {
            from {-webkit-transform: scale(0)}
            to {-webkit-transform: scale(1)}
        }

        @keyframes animatezoom {
            from {transform: scale(0)}
            to {transform: scale(1)}
        }

        /* Change styles for span and cancel button on extra small screens */
        @media screen and (max-width: 300px) {
            span.psw {
                display: block;
                float: none;
            }
            .cancelbtn {
                width: 100%;
            }
        }



    </Style>
</head>



<body>

<div class="header">
    <h1>Talent Match</h1>
</div>

<div class="main">
<button class="button buttonlogin" onclick="openModal('id01', true)"
        style="width:auto" >login
</button>
<div id="id01" class="modal">

    <form class="modal-content animate" action="/action_page.php" method="post">
        <div class="imgcontainer">
            <span onclick="closeModal('id01')" class="close" title="Close Modal">&times;</span>
        </div>

        <div class="container">
            <label><b>Username</b></label>
            <input type="text" placeholder="Enter Username" name="uname" required>

            <label><b>Password</b></label>
            <input type="password" placeholder="Enter Password" name="psw" required>

            <button type="submit">Login</button>
            <label>
                <input type="checkbox" checked="checked" name="remember"> Remember me
            </label>
        </div>

        <div class="container" style="background-color:#f1f1f1">
            <button type="button" onclick="swapModal('id01', 'id02')">register</button>
            <button type="button" onclick="closeModal('id01')" class="cancelbtn">Cancel</button>
        </div>
    </form>
</div>

<div id="id02" class="modal">
    <span onclick="closeModal('id02')" class="close" title="Close Modal">&times;</span>
    <form id="registerForm" class="modal-content animate" action="/action_page.php" onsubmit="return validateRegisterForm()">
        <div class="container">
            <h1>Sign Up</h1>
            <p>Please fill in this form to create an account.</p>
            <hr>
            <input type="hidden" id="accountType" name="accountType" value="candidate">

            <label><b>Register As</b></label>
            <div class="account-type-toggle">
                <button type="button" id="candidateBtn" class="account-type-option active" onclick="setAccountType('candidate')">Candidate</button>
                <button type="button" id="businessBtn" class="account-type-option" onclick="setAccountType('business')">Business</button>
            </div>

            <label><b>Email</b></label>
            <input type="text" placeholder="Enter Email" name="email" required>

            <label><b>Password</b></label>
            <input type="password" id="registerPassword" placeholder="Enter Password" name="psw" required>

            <label><b>Re-enter Password</b></label>
            <input type="password" id="registerPasswordRepeat" placeholder="Re-enter Password" name="psw-repeat" required>

            <div id="abnField" class="hidden-field">
                <label><b>ABN</b></label>
                <input type="text" id="abnInput" placeholder="Enter ABN" name="abn">
            </div>

            <label>
                <input type="checkbox" checked="checked" name="remember" style="margin-bottom:15px"> Remember me
            </label>

            <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>

            <div class="clearfix">
                <button type="button" onclick="swapModal('id02', 'id01')" class="cancelbtn">Cancel</button>
                <button type="submit" class="signupbtn">Sign Up</button>
            </div>
        </div>
    </form>
</div>
<script>
    function openModal(modalId, playAnimation) {
        var modal = document.getElementById(modalId);
        var content = modal.querySelector(".modal-content");

        content.classList.toggle("animate", playAnimation);
        modal.style.display = "block";
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = "none";
    }

    function swapModal(fromModalId, toModalId) {
        closeModal(fromModalId);
        openModal(toModalId, false);
    }

    function setAccountType(type) {
        var isBusiness = type === "business";
        document.getElementById("accountType").value = type;
        document.getElementById("candidateBtn").classList.toggle("active", !isBusiness);
        document.getElementById("businessBtn").classList.toggle("active", isBusiness);
        document.getElementById("abnField").classList.toggle("hidden-field", !isBusiness);
        document.getElementById("abnInput").required = isBusiness;
    }

    function validateRegisterForm() {
        var password = document.getElementById("registerPassword");
        var repeatPassword = document.getElementById("registerPasswordRepeat");

        if (password.value !== repeatPassword.value) {
            repeatPassword.setCustomValidity("Passwords do not match.");
            repeatPassword.reportValidity();
            return false;
        }

        repeatPassword.setCustomValidity("");
        return true;
    }

    document.getElementById("registerPassword").addEventListener("input", function() {
        document.getElementById("registerPasswordRepeat").setCustomValidity("");
    });

    document.getElementById("registerPasswordRepeat").addEventListener("input", function() {
        this.setCustomValidity("");
    });

    window.onclick = function(event) {
        var loginModal = document.getElementById("id01");
        var registerModal = document.getElementById("id02");

        if (event.target == loginModal) {
            closeModal("id01");
        }

        if (event.target == registerModal) {
            closeModal("id02");
        }
    }

    setAccountType("candidate");
</script>



    <div class="box">
      <h2>Recent Job Listings</h2>
      <hr>
      <div class="listing_box">
        <p>Job listings can appear here in boxes like this.........................</p>
      </div>
      </div>
    </div>

</body>
</html>
